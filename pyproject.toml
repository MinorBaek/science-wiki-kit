[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "science-wiki-kit"
version = "0.1.3"
description = "Skills, scripts and templates to build and maintain a scientific knowledge wiki (Obsidian-compatible markdown) with an AI coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["wikikit", "wikikit.lint"]

[tool.setuptools.package-data]
"wikikit.lint" = ["defaults.json"]
